name: Docker Build Image And push 

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frpc
        working-directory: ./
        run: |
          IMAGE_NAME=lianshufeng/frp:frpc
          docker build -f ./dockerfiles/Dockerfile-for-frpc -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Build and push frps
        working-directory: ./
        run: |
          IMAGE_NAME=lianshufeng/frp:frps
          docker build -f ./dockerfiles/Dockerfile-for-frps -t $IMAGE_NAME .
          docker push $IMAGE_NAME
